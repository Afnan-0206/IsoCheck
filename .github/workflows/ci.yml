name: IsoCheck CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build C++20 and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake and Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build IsoCheck Engine and CLI
        run: cmake --build build

      - name: Run GoogleTest Suite (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.txt

      - name: Run Python Workload Tests (pytest)
        run: pytest tests/test_workload.py

      - name: Test Anomaly Verification on Clean History
        run: ./build/cli/isocheck tests/fixtures/clean_serial.jsonl
